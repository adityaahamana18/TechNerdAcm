<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECHNERD 2026 · Live Command Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #0d1830 0%, #060913 70%);
      color: #f8fafc;
      font-family: var(--font-main);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .fs-header {
      padding: 24px 4vw 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      background: rgba(7, 11, 20, 0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .fs-brand-box {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .fs-mark {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #0ea5e9, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      animation: pulseNeon 3s infinite ease-in-out;
    }

    .fs-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
      line-height: 1.1;
    }

    .fs-title small {
      display: block;
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 2.5px;
      font-weight: 700;
      margin-top: 2px;
    }

    .fs-stage-tabs {
      display: flex;
      gap: 8px;
      background: rgba(16, 24, 43, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px;
      border-radius: 12px;
    }

    .fs-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fs-tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .fs-tab-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.5);
      color: var(--cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .fs-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-fs-toggle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-fs-toggle:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
    }

    /* Fullscreen Leaderboard Stage Container */
    .fs-stage-container {
      width: min(1280px, 92vw);
      margin: 30px auto 60px;
    }

    /* Podium Top 3 Cards */
    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 35px;
      align-items: flex-end;
    }

    .podium-card {
      background: linear-gradient(145deg, rgba(16, 24, 43, 0.85), rgba(22, 33, 58, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px 20px 24px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s;
    }

    .podium-card.rank-1 {
      order: 2;
      border-color: rgba(234, 179, 8, 0.5);
      box-shadow: 0 25px 60px rgba(234, 179, 8, 0.2);
      transform: translateY(-12px);
      background: linear-gradient(145deg, rgba(30, 25, 45, 0.95), rgba(45, 35, 20, 0.85));
    }

    .podium-card.rank-2 {
      order: 1;
      border-color: rgba(148, 163, 184, 0.4);
    }

    .podium-card.rank-3 {
      order: 3;
      border-color: rgba(202, 138, 4, 0.4);
    }

    .podium-crown {
      font-size: 38px;
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 12px rgba(234, 179, 8, 0.8));
    }

    .podium-rank-badge {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .rank-1 .podium-rank-badge { background: #eab308; color: #000; }
    .rank-2 .podium-rank-badge { background: #94a3b8; color: #000; }
    .rank-3 .podium-rank-badge { background: #b45309; color: #fff; }

    .podium-name {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .podium-team {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    .podium-score {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 800;
      color: var(--cyan);
    }

    /* Ranked List */
    .fs-table-card {
      background: rgba(16, 24, 43, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 18px;
      padding: 24px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .fs-table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }

    .fs-row-item {
      display: grid;
      grid-template-columns: 50px 1fr 180px 140px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fs-row-item:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateX(4px);
    }

    .fs-rank-num {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 800;
      color: #64748b;
    }

    .fs-rank-num.top-rank {
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    .fs-player-info {
      display: flex;
      flex-direction: column;
    }

    .fs-player-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .fs-player-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .fs-status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      text-align: center;
    }

    .fs-status-pill.qualified {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .fs-status-pill.finalist {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
    }

    .fs-status-pill.eliminated {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fda4af;
    }

    .fs-score-val {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 800;
      color: #c084fc;
      text-align: right;
    }

    @media (max-width: 860px) {
      .podium-grid { grid-template-columns: 1fr; }
      .podium-card.rank-1 { transform: none; order: 1; }
      .podium-card.rank-2 { order: 2; }
      .podium-card.rank-3 { order: 3; }
      .fs-row-item {
        grid-template-columns: 36px 1fr auto;
      }
      .fs-status-pill { display: none; }
      .fs-header { flex-direction: column; gap: 14px; align-items: flex-start; }
      .fs-controls { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Live Header -->
  <header class="fs-header">
    <div class="fs-brand-box">
      <div class="fs-mark">⌁</div>
      <div>
        <h1 class="fs-title">TECH<span class="gradient-text">NERD</span> 2026</h1>
        <small>OFFICIAL LIVE LEADERBOARD ARENA</small>
      </div>
    </div>

    <!-- Stage Navigation Tabs -->
    <div class="fs-stage-tabs">
      <button type="button" class="fs-tab-btn active" onclick="switchFsStage('all', this)">Overall Standings</button>
      <button type="button" class="fs-tab-btn" onclick="switchFsStage('1', this)">Stage 1 (Top 10)</button>
      <button type="button" class="fs-tab-btn" onclick="switchFsStage('2', this)">Stage 2 (Top 3)</button>
      <button type="button" class="fs-tab-btn" onclick="switchFsStage('3', this)">Stage 3 (Final)</button>
    </div>

    <div class="fs-controls">
      <span class="live-badge" style="background:rgba(16,185,129,0.12); border-color:#10b981; color:#10b981;">
        <i style="background:#10b981; box-shadow:0 0 8px #10b981;"></i> LIVE 2.5s SYNC
      </span>
      <button type="button" class="btn-fs-toggle" onclick="toggleFullScreenDoc()">
        <span id="fsIcon">⛶</span> <span id="fsText">Fullscreen</span>
      </button>
    </div>
  </header>

  <main class="fs-stage-container">
    <!-- Top 3 Podium (Populated when >= 3 participants exist) -->
    <div id="podiumArea" class="podium-grid" style="display:none;"></div>

    <!-- Ranked Live Table Card -->
    <div class="fs-table-card">
      <div class="fs-table-header">
        <div>
          <span id="fsHeaderTag" class="section-kicker" style="color:var(--cyan); margin:0;">ALL STAGES AGGREGATE</span>
          <h2 id="fsHeaderTitle" style="font-size:22px; margin:2px 0 0; color:#fff;">Live Participants Leaderboard</h2>
        </div>
        <div id="totalParticipantsCount" style="font-size:13px; color:#94a3b8; font-weight:700;">
          Syncing…
        </div>
      </div>

      <div id="fsLeaderboardList">
        <p class="muted" style="text-align:center; padding:30px;">Connecting to Live Leaderboard...</p>
      </div>
    </div>
  </main>

  <script>
    let activeStage = "all";

    function switchFsStage(stage, btn) {
      activeStage = stage;
      document.querySelectorAll(".fs-tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      const titles = {
        "all": { tag: "ALL STAGES AGGREGATE", title: "Live Participants Leaderboard" },
        "1": { tag: "STAGE 1: CS FUNDAMENTALS", title: "Stage 1 Leaderboard (Top 10 Qualify for Stage 2)" },
        "2": { tag: "STAGE 2: CORE SYSTEMS", title: "Stage 2 Leaderboard (Top 3 Advance to Finals)" },
        "3": { tag: "STAGE 3: SPECIALIZATION", title: "Stage 3 Grand Finale Leaderboard" }
      };

      const meta = titles[stage] || titles["all"];
      document.getElementById("fsHeaderTag").textContent = meta.tag;
      document.getElementById("fsHeaderTitle").textContent = meta.title;

      fetchLeaderboard();
    }

    function toggleFullScreenDoc() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert("Fullscreen error: " + err.message));
        document.getElementById("fsText").textContent = "Exit Fullscreen";
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        document.getElementById("fsText").textContent = "Fullscreen";
      }
    }

    async function fetchLeaderboard() {
      try {
        const res = await fetch(`/api/leaderboard?stage=${activeStage}`);
        if (!res.ok) return;
        const rows = await res.json();
        
        document.getElementById("totalParticipantsCount").textContent = `${rows.length} Competing Participant(s)`;
        
        renderPodium(rows);
        renderTable(rows);
      } catch (e) {
        console.error(e);
      }
    }

    function renderPodium(rows) {
      const podium = document.getElementById("podiumArea");
      if (!rows || rows.length < 3) {
        podium.style.display = "none";
        return;
      }
      podium.style.display = "grid";
      podium.innerHTML = "";

      const top3 = rows.slice(0, 3);
      top3.forEach((p, idx) => {
        const rank = idx + 1;
        const card = document.createElement("div");
        card.className = `podium-card rank-${rank}`;

        let crown = rank === 1 ? `<div class="podium-crown">👑</div>` : "";
        card.innerHTML = `
          ${crown}
          <div class="podium-rank-badge">RANK #${rank}</div>
          <div class="podium-name" title="${p.name}">${p.name}</div>
          <div class="podium-team">${p.team || 'Solo Competitor'}</div>
          <div class="podium-score">${p.score} <small style="font-size:14px;">PTS</small></div>
        `;
        podium.append(card);
      });
    }

    function renderTable(rows) {
      const list = document.getElementById("fsLeaderboardList");
      if (!rows.length) {
        list.innerHTML = `<p class="muted" style="text-align:center; padding:30px;">No participant responses recorded yet for this stage.</p>`;
        return;
      }

      list.innerHTML = "";
      rows.forEach((p, idx) => {
        const rank = idx + 1;
        const item = document.createElement("div");
        item.className = "fs-row-item";

        // Status badge
        let statusHtml = "";
        if (activeStage === "1") {
          statusHtml = idx < 10 
            ? `<span class="fs-status-pill qualified">✓ Top 10 Qualified</span>`
            : `<span class="fs-status-pill eliminated">Eliminated</span>`;
        } else if (activeStage === "2") {
          statusHtml = idx < 3 
            ? `<span class="fs-status-pill finalist">★ Top 3 Finalist</span>`
            : `<span class="fs-status-pill eliminated">Eliminated</span>`;
        }

        item.innerHTML = `
          <div class="fs-rank-num ${rank <= 3 ? 'top-rank' : ''}">${String(rank).padStart(2, '0')}</div>
          <div class="fs-player-info">
            <div class="fs-player-title">
              ${p.name}
              ${p.chosen_topic ? `<span style="font-size:10px; font-weight:700; color:var(--cyan); background:rgba(56,189,248,0.12); border:1px solid rgba(56,189,248,0.3); border-radius:4px; padding:1px 6px;">${p.chosen_topic}</span>` : ''}
            </div>
            <div class="fs-player-sub">${p.team || 'Solo'} · Answered: ${p.answered || 0} (${p.correct || 0} Correct)</div>
          </div>
          <div>${statusHtml}</div>
          <div class="fs-score-val">${p.score} <small style="font-size:11px; opacity:0.8;">PTS</small></div>
        `;

        list.append(item);
      });
    }

    fetchLeaderboard();
    setInterval(fetchLeaderboard, 2500);
  </script>
</body>
</html>
